name: Tests & build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      # Same system libraries as the Dockerfile (OpenCV / MediaPipe / ffmpeg)
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 ffmpeg
      - name: Install Python dependencies
        run: pip install -r requirements-test.txt
      # Tests needing real footage (inputs/ is gitignored) skip here; see -rs output.
      - name: Run pytest
        run: pytest -rs

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install npm dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
